name: Verify Changesets

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - main
    paths:
      - ".changeset/*.md"
      - "packages/**"

permissions:
  contents: read

jobs:
  verify-changesets:
    name: Verify Changesets
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-changeset') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a changeset for package changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          package_files="$(git diff --name-only "$BASE_SHA" HEAD -- 'packages/*/src/**' 'packages/*/package.json')"
          changeset_files="$(git diff --diff-filter=A --name-only "$BASE_SHA" HEAD -- '.changeset/*.md')"

          if [ -n "$package_files" ] && [ -z "$changeset_files" ]; then
            echo "::error::Package sources changed without a changeset. Run 'bun run changeset' or add the 'skip-changeset' label."
            echo "$package_files"
            exit 1
          fi

          echo "Changesets verified."
